<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wizardry</title>
    <link rel="stylesheet" href="fonts/ibm-plex-mono/css/ibm-plex-mono-default.css">
    <style>
      :root {
        color-scheme: light;
        font-family: "IBM Plex Mono", monospace;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f4ec;
        color: #141414;
      }

      main {
        width: min(720px, calc(100% - 48px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 8vw, 5rem);
        font-weight: 600;
        line-height: 0.95;
      }

      p {
        margin: 0;
        max-width: 52ch;
        font-size: 1rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Wizardry</h1>
      <p>Wizardry releases June 5th.</p>
    </main>
  </body>
</html>
